<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 24px;
      font-family:
        system-ui,
        -apple-system,
        Segoe UI,
        Roboto,
        Arial,
        sans-serif;
      background: #0b1020;
      color: #e9eefc;
    }

    .Page {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 18px;
      align-items: start;
    }
    .panel {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 16px;
    }

    .panel h2 {
      margin: 0 0 10px;
      font-size: 16px;
      letter-spacing: 0.2px;
    }
    .hint {
      margin: 0 0 14px;
      font-size: 12px;
      opacity: 0.85;
      line-height: 1.4;
    }

    .row {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }
    label {
      font-size: 12px;
      opacity: 0.9;
    }
    input,
    textarea {
      width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(0, 0, 0, 0.35);
      color: #e9eefc;
      padding: 10px 12px;
      outline: none;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }
    input:focus,
    textarea:focus {
      border-color: rgba(255, 255, 255, 0.35);
    }
    input[type="file"] {
      padding: 10px 10px;
    }

    .fileHint {
      font-size: 12px;
      opacity: 0.8;
      line-height: 1.35;
    }
  </style>
  <body>
    <div class="page">
      <div class="panel" id="formPanel">
        <h2>Certificate Fields</h2>
        <p class="hint">
          Type values below — the certificate updates instantly.
          <br />
          Validation rules apply. Print is enabled only when all fields are ✅
          valid.
        </p>

        <div class="row" id="rowName">
          <label for="studentName">Student Name</label>
          <input
            type="text"
            id="studentName"
            placeholder="e.g., Ahmed Al Esaam"
            autocomplete="off"
          />
        </div>

        <div class="row" id="rowCourse">
          <label for="courseName">Course Name</label>
          <textarea
            id="courseName"
            placeholder="e.g.,Goal Settings: Crafting and Achieving Your Objectives."
          ></textarea>
        </div>

        <div class="row" id="rowInstructor">
          <label for="instructorName">Instructor Name</label>
          <input
            id="instructorName"
            type="text"
            placeholder="e.g., Dr. Mohammed Abu-Hadhoud"
            autocomplete="off"
          />
        </div>

        <div class="row" id="rowSignature">
          <label for="signatureFile">Signature Image</label>
          <input id="signatureFile" type="file" accept="image/*" />
          <div class="fileHint">
            Upload a PNG/JPG/WebP. It will update the signature instantly.
          </div>
        </div>

        <div class="row" id="rowIssued">
          <label for="issuedDate">Issued Date</label>
          <input id="issuedDate" type="date" />
        </div>

        <div class="row" id="rowSerial">
          <label for="serial">Certificate Serial</label>
          <input
            id="serial"
            type="text"
            placeholder="e.g., MD-2025-000123"
            autocomplete="off"
          />
        </div>
      </div>
    </div>
  </body>
</html>
